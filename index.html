<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Trixi – Lauf zum Futternapf!</title>
    <base href="./" />
    <link href="css/trixi.css" rel="stylesheet" />
    <link rel="icon" href="favicon.png" />
</head>

<body>
    <div id="app">
        <!-- Shown while the browser downloads the game engine (replaced as soon as the game page is ready). -->
        <div class="overlay">
            <div class="card">
                <h1>Trixi</h1>
                <p class="subtitle">Lauf zum Futternapf!</p>
                <p>Das Spiel wird geladen …</p>
                <div class="bar"><div class="fill boot"></div></div>
                <noscript><p class="error">Bitte JavaScript erlauben – sonst kann das Spiel nicht starten.</p></noscript>
            </div>
        </div>
    </div>

    <!-- Erweiterung 14: shown instead of the game on phones and tablets (filled in by the script below). -->
    <div id="device-notice" class="notice-screen" hidden>
        <div class="card notice">
            <img class="pixel" src="img/device-notice.png" width="256" height="120" alt="Trixi sitzt neben einem Laptop" />
            <h2 id="notice-title"></h2>
            <p id="notice-message"></p>
            <p class="hint small" id="notice-send"></p>
            <p class="address" id="notice-address"></p>
            <button class="copy-button" id="notice-copy" type="button"></button>
            <p class="hint small" id="notice-copied" aria-live="polite"></p>
            <p class="hint small"><a href="#" id="notice-anyway"></a></p>
        </div>
    </div>

    <div id="crash" hidden>
        <div class="card">
            <p>Hoppla, das Spiel ist hängen geblieben.</p>
            <button class="play" onclick="location.reload()">Neu laden</button>
            <p class="hint">Dein Fortschritt bleibt gespeichert.</p>
        </div>
    </div>

    <!-- Erweiterung 14: phone or tablet? Decided before anything of the game is downloaded (no game package needed). -->
    <script src="js/device-check.js"></script>
    <script>
        window.TrixiDeviceGate = (function () {
            const T = TrixiDevice.TEXTS;
            const result = TrixiDevice.classify(TrixiDevice.readInfo(window));
            let tryAnyway = false;
            try {
                tryAnyway = sessionStorage.getItem("trixi.tryAnyway") === "1";
            } catch (e) { /* storage blocked: show the notice again */ }
            const gate = { result, blocked: result.blocked && !tryAnyway, started: false, start: null };
            const $ = (id) => document.getElementById(id);

            function begin() {
                if (gate.started || !gate.start) {
                    return;
                }
                gate.started = true;
                gate.start();
            }

            function showNotice() {
                const address = location.origin + location.pathname;
                $("notice-title").textContent = T.title;
                $("notice-message").textContent = T.message;
                $("notice-send").textContent = T.sendHint;
                $("notice-address").textContent = address;
                $("notice-copy").textContent = T.copy;
                $("notice-anyway").textContent = T.tryAnyway;
                $("notice-copy").onclick = async function () {
                    let ok = false;
                    try {
                        // Some browsers never answer (no permission asked): give up after two seconds.
                        await Promise.race([navigator.clipboard.writeText(address),
                            new Promise((_, reject) => setTimeout(() => reject(new Error("no answer")), 2000))]);
                        ok = true;
                    } catch (e) {
                        // Older browsers: copy through a selected text field.
                        const field = document.createElement("textarea");
                        field.value = address;
                        document.body.appendChild(field);
                        field.select();
                        try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
                        field.remove();
                    }
                    $("notice-copied").textContent = ok ? T.copied : T.copyFailed;
                };
                $("notice-anyway").onclick = function (event) {
                    event.preventDefault();
                    try { sessionStorage.setItem("trixi.tryAnyway", "1"); } catch (e) { /* only for this page view then */ }
                    gate.blocked = false;
                    $("device-notice").hidden = true;
                    $("app").hidden = false;
                    begin();
                };
                $("app").hidden = true;
                $("device-notice").hidden = false;
            }

            /** The game loader runs through here: at once on a computer, on a phone or tablet only after "trotzdem". */
            gate.whenAllowed = function (start) {
                gate.start = start;
                if (gate.blocked) {
                    showNotice();
                } else {
                    begin();
                }
            };
            return gate;
        })();
    </script>
    <script src="js/trixi.js"></script>
    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>

    <!-- .NET starts only after all scripts above are loaded (KNI's scripts must be there before the game runs). -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module">
        import { BrotliDecode } from "./js/decode.min.js";

        // Plain static hosts (GitHub Pages, a USB stick web server …) do not always compress the engine files.
        // The build ships Brotli-compressed copies (.br): fetch those (about a third of the size) and unpack them
        // here. If that fails for any reason, the normal file is used.
        const useBrotli = location.protocol.startsWith("http") && location.hostname !== "localhost";
        // Erweiterung 14: on phones and tablets the notice comes first and the engine is not downloaded.
        TrixiDeviceGate.whenAllowed(() => Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                if (!useBrotli || type === "dotnetjs") {
                    return null;
                }
                return (async function () {
                    try {
                        const response = await fetch(defaultUri + ".br", { cache: "no-cache" });
                        if (!response.ok) {
                            throw new Error(response.statusText);
                        }
                        const bytes = BrotliDecode(new Int8Array(await response.arrayBuffer()));
                        const contentType = type === "dotnetwasm" ? "application/wasm" : "application/octet-stream";
                        return new Response(bytes, { headers: { "content-type": contentType } });
                    } catch (e) {
                        console.warn("Trixi: compressed download failed, using the normal file", name, e);
                        return fetch(defaultUri, { cache: "no-cache" });
                    }
                })();
            }
        }));
    </script>
</body>

</html>
